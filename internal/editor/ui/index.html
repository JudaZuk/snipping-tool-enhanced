<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8">
<title>Snipping Tool Enhanced</title>
<style>
:root {
  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --bar: #f3f5f9; --bar-border: #e5e7eb; --canvas: #fafbfe; --text: #1a1a1a; --muted: #616161;
  --btn: #ffffff; --btn-border: #e0e0e0; --btn-border-bottom: #cfcfcf; --hover: rgba(0,0,0,.045); --press: rgba(0,0,0,.08);
  --accent: #005fb8; --accent-text: #ffffff; --seg: rgba(0,0,0,.035); --sep: #e0e0e0; --disabled: #b3b3b3;
  --flyout: #f9f9f9; --flyout-border: rgba(0,0,0,.1); --shadow: 0 8px 16px rgba(0,0,0,.14), 0 0 2px rgba(0,0,0,.08);
  --card: #ffffff; --card-border: #e5e5e5; --page: #f3f3f3; --field: #ffffff;
}
:root[data-theme="dark"] {
  --bar: #202020; --bar-border: #2d2d2d; --canvas: #1c1c1c; --text: #ffffff; --muted: #c5c5c5;
  --btn: #2d2d2d; --btn-border: #383838; --btn-border-bottom: #303030; --hover: rgba(255,255,255,.06); --press: rgba(255,255,255,.04);
  --accent: #60cdff; --accent-text: #000000; --seg: rgba(255,255,255,.04); --sep: #3a3a3a; --disabled: #5d5d5d;
  --flyout: #2c2c2c; --flyout-border: rgba(0,0,0,.4); --shadow: 0 8px 16px rgba(0,0,0,.36), 0 0 2px rgba(0,0,0,.3);
  --card: #2b2b2b; --card-border: #1d1d1d; --page: #202020; --field: #2d2d2d;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; font: 14px/20px var(--font); color: var(--text); background: var(--canvas); overflow: hidden; user-select: none; -webkit-font-smoothing: antialiased; }
svg { width: 20px; height: 20px; flex: none; }
.ic { fill: none; stroke: currentColor; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
#app { display: flex; flex-direction: column; height: 100%; }

/* ---------- command bar ---------- */
header { display: flex; align-items: center; height: 48px; padding: 0 8px 0 10px; background: var(--bar); border-bottom: 1px solid var(--bar-border); gap: 4px; flex: none; }
.group { display: flex; align-items: center; gap: 4px; }
.center { flex: 1; justify-content: center; min-width: 0; }
.right { margin-left: auto; }
button { font: inherit; color: inherit; border: 1px solid transparent; background: transparent; border-radius: 4px; height: 32px; min-width: 32px; padding: 0 6px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: default; position: relative; }
button:hover:not(:disabled) { background: var(--hover); }
button:active:not(:disabled) { background: var(--press); }
button:disabled { color: var(--disabled); }
button:focus-visible { outline: 2px solid var(--text); outline-offset: 0; }
.btn-new { background: var(--btn); border-color: var(--btn-border); border-bottom-color: var(--btn-border-bottom); padding: 0 12px 0 10px; height: 32px; }
.btn-new:hover:not(:disabled) { background: var(--btn); filter: brightness(.98); }
.btn-new svg { width: 16px; height: 16px; }
.seg { display: flex; gap: 2px; padding: 2px; background: var(--seg); border: 1px solid var(--btn-border); border-radius: 6px; margin-left: 10px; }
.seg button { height: 30px; width: 36px; }
.seg button.on { background: var(--btn); border-color: var(--btn-border); border-bottom-color: var(--btn-border-bottom); }
.seg button.on::after, .tool.on::after { content: ""; position: absolute; left: 50%; bottom: 2px; width: 14px; height: 3px; margin-left: -7px; border-radius: 2px; background: var(--accent); }
.tool.on::after { display: none; }
.ddl { padding: 0 6px 0 8px; gap: 2px; margin-left: 6px; }
.ddl .chev { width: 12px; height: 12px; margin-left: 2px; }
.ddl .ddl-text { font-size: 12px; color: var(--muted); margin-left: 2px; }
.sep { width: 1px; height: 24px; background: var(--sep); margin: 0 8px; flex: none; }
.icon-btn { width: 36px; }
.tool { width: 36px; height: 36px; }
.tool.on { background: var(--btn); border-color: var(--accent); }
.tool .tchev { position: absolute; bottom: 1px; left: 50%; width: 10px; height: 10px; margin-left: -5px; display: none; }
.tool.on .tchev { display: block; }
.text-btn { padding: 0 10px; }
.only-image { display: none !important; }
body.has-image .only-image { display: inline-flex !important; }
body.has-image .only-empty { display: none !important; }
.sep.only-image { display: none !important; }
body.has-image .sep.only-image { display: block !important; }

/* ---------- canvas area ---------- */
main { flex: 1; position: relative; overflow: auto; background: var(--canvas); }
#empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 24px; }
#empty .line { font-size: 14px; }
#empty b { font-weight: 600; }
.winkey { display: inline-block; width: 12px; height: 12px; vertical-align: -1px; margin-right: 1px; }
#empty .hint { font-size: 12px; color: var(--muted); max-width: 440px; }
#empty .link { color: var(--accent); text-decoration: underline; cursor: pointer; }
body.has-image #empty { display: none; }
#stageWrap { min-width: 100%; min-height: 100%; display: none; align-items: center; justify-content: center; padding: 32px; }
body.has-image #stageWrap { display: flex; }
#stage { position: relative; }
#view { display: block; box-shadow: 0 1px 4px rgba(0,0,0,.08), 0 0 0 1px rgba(0,0,0,.03); touch-action: none;
  background-color: #fff; background-image: linear-gradient(45deg,#eee 25%,transparent 25%),linear-gradient(-45deg,#eee 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#eee 75%),linear-gradient(-45deg,transparent 75%,#eee 75%);
  background-size: 16px 16px; background-position: 0 0,0 8px,8px -8px,-8px 0; }
#textEdit { position: absolute; display: none; border: none; outline: none; resize: none; overflow: hidden; background: transparent; padding: 0; margin: 0; white-space: pre-wrap; line-height: 1.25; caret-color: var(--accent); }
#cropBar { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); display: none; gap: 4px; padding: 4px; background: var(--flyout); border: 1px solid var(--flyout-border); border-radius: 8px; box-shadow: var(--shadow); z-index: 5; }
#cropBar.show { display: flex; }
#cropBar .apply { background: var(--accent); color: var(--accent-text); width: 40px; }
#cropBar .apply:hover { background: var(--accent); filter: brightness(1.08); }
#taBar { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); display: none; gap: 2px; padding: 4px; background: var(--flyout); border: 1px solid var(--flyout-border); border-radius: 8px; box-shadow: var(--shadow); z-index: 5; align-items: center; white-space: nowrap; }
#taBar.show { display: flex; }
#taBar .ta-status { padding: 0 10px; font-size: 13px; color: var(--muted); }
#taBar button { padding: 0 10px; }
#taBar .chev-only { min-width: 24px; width: 24px; padding: 0; margin-left: -2px; }
#cropBar .crop-hint { align-self: center; padding: 0 10px 0 6px; font-size: 13px; color: var(--muted); white-space: nowrap; }

/* ---------- flyouts and menus ---------- */
.flyout { position: fixed; z-index: 20; background: var(--flyout); border: 1px solid var(--flyout-border); border-radius: 8px; box-shadow: var(--shadow); padding: 4px; min-width: 160px; display: none; animation: pop .12s ease-out; }
.flyout.show { display: block; }
@keyframes pop { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.mi { display: flex; align-items: center; gap: 12px; width: 100%; height: 34px; padding: 0 12px 0 10px; border-radius: 4px; justify-content: flex-start; position: relative; white-space: nowrap; }
.mi .kb { margin-left: auto; padding-left: 24px; color: var(--muted); font-size: 12px; }
.mi.checked::before { content: ""; position: absolute; left: 2px; top: 10px; width: 3px; height: 14px; border-radius: 2px; background: var(--accent); }
.mi svg { width: 16px; height: 16px; }
.mi .check { width: 16px; height: 16px; visibility: hidden; }
.mi.ticked .check { visibility: visible; }
.msep { height: 1px; background: var(--sep); margin: 4px -4px; }
.fly-pad { padding: 8px; width: 264px; }
.fly-title { font-size: 12px; color: var(--muted); margin: 4px 2px 8px; }
.swatches { display: grid; grid-template-columns: repeat(6, 32px); gap: 8px; justify-content: space-between; }
.sw { width: 32px; height: 32px; min-width: 0; padding: 0; border-radius: 50%; border: 1px solid rgba(0,0,0,.15); }
.sw.on { outline: 2px solid var(--text); outline-offset: 2px; }
.sw.none { background: linear-gradient(135deg, transparent 46%, #e81123 46%, #e81123 54%, transparent 54%), var(--field); }
.row { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
.row label { font-size: 12px; color: var(--muted); min-width: 64px; }
input[type=range] { flex: 1; accent-color: var(--accent); }
.val { width: 28px; text-align: right; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.shape-kinds { display: flex; gap: 4px; }
.shape-kinds button { width: 40px; height: 40px; border: 1px solid var(--btn-border); background: var(--btn); }
.shape-kinds button.on { border-color: var(--accent); }
.wide-btn { width: 100%; justify-content: flex-start; padding: 0 10px; height: 36px; margin-top: 8px; border: 1px solid var(--btn-border); background: var(--btn); }
.emoji-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; margin-top: 8px; }
.emoji-grid button { font-size: 20px; height: 32px; min-width: 0; padding: 0; font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif; }
select { font: inherit; font-size: 13px; color: var(--text); background: var(--field); border: 1px solid var(--btn-border); border-bottom-color: var(--btn-border-bottom); border-radius: 4px; height: 30px; padding: 0 6px; }
.zoomrow { display: flex; align-items: center; gap: 4px; padding: 2px 6px 2px 10px; height: 36px; }
.zoomrow span.lbl { flex: 1; }
.zoomrow .pct { width: 48px; text-align: center; font-variant-numeric: tabular-nums; }

/* text properties bar */
#textBar { position: fixed; z-index: 15; display: none; align-items: center; gap: 4px; padding: 4px; background: var(--flyout); border: 1px solid var(--flyout-border); border-radius: 8px; box-shadow: var(--shadow); }
#textBar.show { display: flex; }
#textBar .sw { width: 22px; height: 22px; }

/* ---------- settings page ---------- */
#settings { position: absolute; inset: 0; background: var(--page); overflow: auto; display: none; z-index: 10; }
#settings.show { display: block; }
.set-wrap { max-width: 760px; margin: 0 auto; padding: 20px 24px 40px; }
.set-head { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
.set-head h1 { font-size: 28px; line-height: 36px; font-weight: 600; margin: 0; }
.set-sec { font-size: 14px; font-weight: 600; margin: 20px 0 8px; }
.card { display: flex; align-items: center; gap: 16px; background: var(--card); border: 1px solid var(--card-border); border-radius: 6px; padding: 14px 16px; margin-bottom: 4px; min-height: 64px; }
.card .txt { flex: 1; }
.card .t { font-size: 14px; }
.card .d { font-size: 12px; color: var(--muted); line-height: 16px; margin-top: 2px; }
.card.sub { margin-left: 40px; }
.toggle { display: inline-flex; align-items: center; gap: 12px; font-size: 14px; }
.toggle input { appearance: none; width: 40px; height: 20px; border-radius: 10px; border: 1px solid var(--muted); position: relative; margin: 0; background: transparent; transition: .15s; }
.toggle input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 12px; height: 12px; border-radius: 50%; background: var(--muted); transition: .15s; }
.toggle input:checked { background: var(--accent); border-color: var(--accent); }
.toggle input:checked::after { left: 23px; background: var(--accent-text); }
.btn { background: var(--btn); border: 1px solid var(--btn-border); border-bottom-color: var(--btn-border-bottom); padding: 0 12px; }
.btn.accent { background: var(--accent); color: var(--accent-text); border-color: transparent; }
.radio { display: flex; flex-direction: column; gap: 8px; }
.radio label { display: flex; align-items: center; gap: 8px; }
.radio input { accent-color: var(--accent); width: 18px; height: 18px; margin: 0; }

/* ---------- dialog / toast ---------- */
#scrim { position: fixed; inset: 0; background: rgba(0,0,0,.3); display: none; align-items: center; justify-content: center; z-index: 30; }
#scrim.show { display: flex; }
.dialog { display: flex; flex-direction: column; max-height: calc(100vh - 16px); width: 448px; max-width: calc(100% - 32px); background: var(--flyout); border: 1px solid var(--flyout-border); border-radius: 8px; box-shadow: var(--shadow); overflow: hidden; }
.dialog .body { padding: 24px; overflow: auto; min-height: 0; flex: 1; }
.dialog .foot { flex: none; }
.dialog h2 { font-size: 20px; line-height: 28px; font-weight: 600; margin: 0 0 12px; }
.dialog .foot { display: flex; gap: 8px; padding: 24px; background: var(--bar); border-top: 1px solid var(--bar-border); }
.dialog .foot button { flex: 1; }
#toast { position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 12px); opacity: 0; transition: .16s; background: var(--flyout); border: 1px solid var(--flyout-border); box-shadow: var(--shadow); border-radius: 8px; padding: 10px 16px; z-index: 40; pointer-events: none; max-width: 80%; }
#toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
#toast a { color: var(--accent); cursor: pointer; text-decoration: underline; margin-left: 8px; }
#printImg { display: none; }
/* ---------- video view ---------- */
.only-video { display: none !important; }
body.has-video .only-video { display: inline-flex !important; }
body.has-video .only-image { display: none !important; }
body.has-video .sep.only-video { display: block !important; }
body.has-video #empty, body.has-video #stageWrap { display: none !important; }
body.has-video .only-empty { display: none !important; }
#videoWrap { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; }
body.has-video #videoWrap { display: flex; }
#vid { max-width: 100%; max-height: calc(100% - 90px); background: #000; border-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
#trimBar { display: none; width: min(900px, 100%); align-items: center; gap: 12px; }
#trimBar.show { display: flex; }
#trimTrack { position: relative; flex: 1; height: 36px; border-radius: 6px; background: var(--seg); border: 1px solid var(--btn-border); touch-action: none; }
#trimSel { position: absolute; top: -1px; bottom: -1px; border: 2px solid var(--accent); border-radius: 6px; background: color-mix(in srgb, var(--accent) 12%, transparent); }
.trimHandle { position: absolute; top: 3px; bottom: 3px; width: 10px; margin-left: -5px; border-radius: 4px; background: var(--accent); cursor: ew-resize; }
#trimHead { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--text); pointer-events: none; }
.tlabel { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 52px; text-align: center; }
.gif-info { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; font-size: 13px; margin: 10px 2px; }
.gif-info span:nth-child(odd) { color: var(--muted); }
.qual { display: flex; gap: 4px; }
.qual button { flex: 1; border: 1px solid var(--btn-border); background: var(--btn); }
.qual button.on { border-color: var(--accent); color: var(--accent); }
.fly-actions { display: flex; gap: 8px; margin-top: 12px; }
.fly-actions button { flex: 1; }
.progress { height: 4px; border-radius: 2px; background: var(--seg); margin-top: 12px; overflow: hidden; display: none; }
.progress.show { display: block; }
.progress div { height: 100%; width: 0; background: var(--accent); transition: width .1s; }
@media print {
  #app, #toast, .flyout, #scrim, #textBar { display: none !important; }
  html, body { background: #fff; overflow: visible; }
  #printImg { display: block; max-width: 100%; max-height: 100vh; margin: 0 auto; }
}
</style>
</head>

window.addEventListener("keydown", (e) => {
  if (e.target === te) return;
  if ($("scrim").classList.contains("show")) { if (e.key === "Escape") closeDialog("cancel"); return; }
  const k = e.key.toLowerCase(), tag = e.target.tagName;
  if (tag === "INPUT" || tag === "SELECT") return;
  if (e.altKey && !e.ctrlKey) {
    if (k === "m") { e.preventDefault(); modeMenu(); } else if (k === "n") { e.preventDefault(); newSnip(); } else if (k === "d") { e.preventDefault(); delayMenu(); }
    return;
  }
  if (S.textMode && e.ctrlKey && (k === "a" || k === "c")) {
    e.preventDefault();
    if (k === "a") { selectAllWords(); } else copySelectedText();
    return;
  }
  if (S.textMode && k === "escape") { endTextActions(); return; }
  if (e.ctrlKey) {
    if (S.video) {
      const vmap = { n: newSnip, o: openFile, s: saveVideo };
      if (vmap[k]) { e.preventDefault(); vmap[k](); }
      return;
    }
    const map = { n: newSnip, o: openFile, s: saveAs, c: copyImage, p: printImage, z: () => (e.shiftKey ? redo() : undo()), y: redo,
      "0": () => setZoom(1, true), "1": () => setZoom(1, false), "=": () => setZoom(S.zoom * 1.25), "+": () => setZoom(S.zoom * 1.25), "-": () => setZoom(S.zoom / 1.25) };
    if (map[k]) { e.preventDefault(); map[k](); }
    return;
  }
  if (k === "escape") {
    if (fly.classList.contains("show")) closeFlyout();
    else if (S.cropping) cancelCrop();
    else if (S.draft) { S.draft = null; render(); }
    else if (S.sel >= 0) { S.sel = -1; render(); updateTextBar(); }
    else if ($("settings").classList.contains("show")) hideSettings();
  } else if (k === "enter" && S.cropping) applyCrop();
  else if ((k === "delete" || k === "backspace") && S.sel >= 0) { S.objects.splice(S.sel, 1); S.sel = -1; commit(); }
});

/* Copy as table: words are grouped into rows by vertical position and into
   cells by horizontal gaps wider than about one character height. */
function tableText(words) {
  if (!words.length) return "";
  const hs = words.map(w => w.h).sort((a, b) => a - b), mh = hs[Math.floor(hs.length / 2)] || 10;
  const sorted = [...words].sort((a, b) => (a.y + a.h / 2) - (b.y + b.h / 2));
  const rows = [];
  for (const w of sorted) {
    const cy = w.y + w.h / 2, row = rows[rows.length - 1];
    if (row && Math.abs(cy - row.cy) <= mh * 0.6) { row.words.push(w); row.cy = (row.cy * (row.words.length - 1) + cy) / row.words.length; }
    else rows.push({ cy, words: [w] });
  }
  // Column boundaries shared by all rows: x positions where a cell starts after a wide gap.
  const starts = [];
  for (const r of rows) {
    r.words.sort((a, b) => a.x - b.x);
    r.cells = [];
    let cur = null;
    for (const w of r.words) {
      if (!cur || w.x - (cur.x2) > mh * 1.1) { cur = { x: w.x, x2: w.x + w.w, text: w.text }; r.cells.push(cur); starts.push(w.x); }
      else { cur.text += " " + w.text; cur.x2 = w.x + w.w; }
    }
  }
  starts.sort((a, b) => a - b);
  const cols = [];
  for (const x of starts) if (!cols.length || x - cols[cols.length - 1] > mh * 1.5) cols.push(x);
  const colOf = (x) => { let k = 0; cols.forEach((c, i) => { if (x >= c - mh * 0.75) k = i; }); return k; };
  return rows.map(r => {
    const out = new Array(cols.length).fill("");
    for (const c of r.cells) { const k = colOf(c.x); out[k] = out[k] ? out[k] + " " + c.text : c.text; }
    while (out.length > 1 && out[out.length - 1] === "") out.pop();
    return out.join("\t");
  }).join("\r\n");
}

/* Redaction: opaque black boxes, flattened when the image is saved or copied. */
const REDACT = { email: true, phone: true };
const EMAIL_RE = /[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g;
const PHONE_RE = /\+?\(?\d[\d\s().\/-]{5,}\d/g;
function findSensitive(words, kinds) {
  const byLine = new Map();
  words.forEach(w => { if (!byLine.has(w.line)) byLine.set(w.line, []); byLine.get(w.line).push(w); });
  const hits = [];
  for (const ws of byLine.values()) {
    ws.sort((a, b) => a.x - b.x);
    let str = "", spans = [];
    ws.forEach((w, i) => { if (i) str += " "; spans.push([str.length, str.length + w.text.length]); str += w.text; });
    const take = (re, check) => { re.lastIndex = 0; let m; while ((m = re.exec(str))) { if (check && !check(m[0])) continue; const s0 = m.index, s1 = m.index + m[0].length; const hit = ws.filter((w, i) => spans[i][0] < s1 && spans[i][1] > s0); if (hit.length) hits.push(hit); } };
    if (kinds.email) take(EMAIL_RE);
    if (kinds.phone) take(PHONE_RE, (t) => (t.match(/\d/g) || []).length >= 7);
  }
  return hits;
}
function redactBoxes(groups) {
  const pad = 2;
  let n = 0;
  for (const g of groups) {
    const x0 = Math.min(...g.map(w => w.x)) - pad, y0 = Math.min(...g.map(w => w.y)) - pad;
    const x1 = Math.max(...g.map(w => w.x + w.w)) + pad, y1 = Math.max(...g.map(w => w.y + w.h)) + pad;
    S.objects.push({ type: "redact", x: x0, y: y0, w: x1 - x0, h: y1 - y0 }); n++;
  }
  if (n) commit();
  return n;
}

  if (!S.ocr) return;
  const n = redactBoxes(findSensitive(S.ocr.words, REDACT));
  toast(n ? `${n} item${n > 1 ? "s" : ""} redacted` : "No email addresses or phone numbers found");
}

  idx.forEach(i => { const w = S.ocr.words[i]; if (!byLine.has(w.line)) byLine.set(w.line, []); byLine.get(w.line).push(w); });
  redactBoxes([...byLine.values()]); S.tsel = null; updateTaButtons(); render();

const vid = $("vid");
function fmtTime(t) { t = Math.max(0, t || 0); const m = Math.floor(t / 60), sec = Math.floor(t % 60), ds = Math.floor((t * 10) % 10); return `${m}:${String(sec).padStart(2, "0")}.${ds}`; }

  $("textBar").classList.remove("show"); $("cropBar").classList.remove("show"); $("trimBar").classList.remove("show"); $("btnTrim").classList.remove("on");

  $("trimA").style.left = pct(v.start); $("trimB").style.left = pct(v.end);

function dragHandle(el, which) {
  el.addEventListener("pointerdown", (e) => {
    e.preventDefault(); el.setPointerCapture(e.pointerId);
    const track = $("trimTrack").getBoundingClientRect(), v = S.video;
    const move = (ev) => {
      const t = Math.max(0, Math.min(1, (ev.clientX - track.left) / track.width)) * v.duration;
      if (which === "a") v.start = Math.min(t, v.end - 0.2); else v.end = Math.max(t, v.start + 0.2);
      vid.currentTime = which === "a" ? v.start : v.end; updateTrim();
    };
    const up = () => { el.removeEventListener("pointermove", move); el.removeEventListener("pointerup", up); };
    el.addEventListener("pointermove", move); el.addEventListener("pointerup", up);
  });
}
dragHandle($("trimA"), "a"); dragHandle($("trimB"), "b");
$("trimTrack").addEventListener("pointerdown", (e) => {
  if (e.target.classList.contains("trimHandle") || !S.video) return;
  const r = $("trimTrack").getBoundingClientRect(); vid.currentTime = Math.max(S.video.start, Math.min(S.video.end, (e.clientX - r.left) / r.width * S.video.duration));
});
async function saveVideo() {
  const v = S.video; if (!v) return;
  try {
    const p = await callAsync("stSaveVideo", v.path, v.start, v.end || v.duration, v.duration);
    if (p) { v.unsaved = false; call("stSetDirty", false); toast(`Saved to ${esc(p)}<a id="tShow">Show in folder</a>`, 5000); const a = $("tShow"); if (a) a.onclick = () => call("stShowInFolder", p); }
  } catch (e) { toast("Save failed: " + esc(e), 8000); }
  return S.video && !S.video.unsaved;
}
$("btnSaveVideo").onclick = saveVideo;
async function shareVideo() {
  const v = S.video; if (!v) return;
  try { await callAsync("stShareVideo", v.path, v.start, v.end || v.duration, v.duration); } catch (e) { toast("Share failed: " + esc(e), 8000); }
}
$("btnShareVideo").onclick = shareVideo;

const GIF_Q = { low: { fps: 10, maxW: 480, label: "Low" }, high: { fps: 15, maxW: 960, label: "High" } };
let gifQuality = "high", gifBusy = false;
function gifPlan() {
  const v = S.video, q = GIF_Q[gifQuality];
  const dur = Math.min(30, Math.max(0, (v.end || v.duration) - v.start));
  const w0 = vid.videoWidth || 0, h0 = vid.videoHeight || 0, k = w0 > q.maxW ? q.maxW / w0 : 1;
  return { dur, fps: q.fps, w: Math.max(2, Math.round(w0 * k)), h: Math.max(2, Math.round(h0 * k)), frames: Math.max(1, Math.round(dur * q.fps)) };
}
function gifMenu() {
  if (!S.video) return;
  const render = () => {
    const p = gifPlan();
    return `<div class="fly-pad" style="width:300px"><div class="fly-title">Export as GIF</div>
      <div class="qual"><button data-q="low" class="${gifQuality === "low" ? "on" : ""}">Low quality</button><button data-q="high" class="${gifQuality === "high" ? "on" : ""}">High quality</button></div>
      <div class="gif-info"><span>Duration</span><span>${p.dur.toFixed(1)} s${(S.video.end - S.video.start) > 30 ? " (first 30 s)" : ""}</span><span>Resolution</span><span>${p.w} × ${p.h}</span><span>Frame rate</span><span>${p.fps} fps</span></div>
      <div class="progress" id="gifProg"><div></div></div>
      <div class="fly-actions"><button class="btn" id="gifCopy">Copy</button><button class="btn accent" id="gifExport">Export</button></div></div>`;
  };
  const bind = (f) => {
    f.querySelectorAll("[data-q]").forEach(b => b.onclick = () => { if (gifBusy) return; gifQuality = b.dataset.q; f.innerHTML = render(); bind(f); });
    $("gifExport").onclick = () => exportGif("save");
    $("gifCopy").onclick = () => exportGif("copy");
  };
  openFlyout($("btnGif"), render(), bind, "right");
}
$("btnGif").onclick = gifMenu;
function seek(t) { return new Promise((res) => { const on = () => { vid.removeEventListener("seeked", on); res(); }; vid.addEventListener("seeked", on); vid.currentTime = t; }); }
async function exportGif(action) {
  if (gifBusy || !S.video) return;
  gifBusy = true;
  const p = gifPlan(), prog = $("gifProg"), bar = prog && prog.firstElementChild;
  if (prog) prog.classList.add("show");
  const wasT = vid.currentTime; vid.pause();
  try {
    const id = await call("stGifBegin", gifQuality);
    const c = document.createElement("canvas"); c.width = p.w; c.height = p.h; const g = c.getContext("2d");
    for (let i = 0; i < p.frames; i++) {
      await seek(S.video.start + i / p.fps);
      g.drawImage(vid, 0, 0, p.w, p.h);
      await call("stGifFrame", id, c.toDataURL("image/png"));
      if (bar) bar.style.width = (100 * (i + 1) / p.frames) + "%";
    }
    const r = await callAsync("stGifFinish", id, action, S.video.name);
    closeFlyout();
    if (action === "copy") toast("GIF copied to clipboard");
    else if (r) { toast(`Saved to ${esc(r)}<a id="tShow">Show in folder</a>`, 5000); const a = $("tShow"); if (a) a.onclick = () => call("stShowInFolder", r); }
  } catch (e) { toast("GIF export failed: " + esc(e), 8000); }
  finally { gifBusy = false; vid.currentTime = wasT; }
}

/* ===================================================================== dialog / close */
let dlgResolve = null;
function dialog(title, text, buttons, keepBody) {
  $("dlgTitle").textContent = title; if (!keepBody) $("dlgText").textContent = text;
  $("dlgFoot").innerHTML = buttons.map(([id, label, primary]) => `<button class="btn ${primary ? "accent" : ""}" data-r="${id}">${label}</button>`).join("");
  $("scrim").classList.add("show");
  $("dlgFoot").querySelectorAll("[data-r]").forEach(b => b.onclick = () => closeDialog(b.dataset.r));
  $("dlgFoot").querySelector("button").focus();
  return new Promise(r => dlgResolve = r);
}
function closeDialog(r) { $("scrim").classList.remove("show"); if (dlgResolve) { const f = dlgResolve; dlgResolve = null; f(r); } }
window.stRequestClose = async () => {
  const isVideo = !!S.video;
  const r = await dialog(isVideo ? "Save recording?" : "Save changes?",
    isVideo ? "This screen recording has not been saved. Do you want to save it?" : "Do you want to save the changes to your snip?",
    [["save", "Save", true], ["discard", "Don't save"], ["cancel", "Cancel"]]);
  if (r === "cancel") return;
  if (r === "save" && !(isVideo ? await saveVideo() : await saveAs())) return;
  call("stClose");
};

/* ===================================================================== mode / delay / empty state */
function updateMode() {
  const kind = S.settings.kind === "record" ? "record" : "snip";
  $("segSnip").classList.toggle("on", kind === "snip"); $("segSnip").setAttribute("aria-checked", kind === "snip");
  $("segRec").classList.toggle("on", kind === "record"); $("segRec").setAttribute("aria-checked", kind === "record");
  if (!modesFor(kind).some(m => m.id === S.settings.mode)) S.settings.mode = "rectangle";
  $("btnNew").title = kind === "record" ? "New recording (Ctrl+N)" : "New snip (Ctrl+N)";
  const m = MODES.find(x => x.id === S.settings.mode) || MODES[0];
  $("modeIcon").innerHTML = `<use href="#${m.icon}"/>`; $("btnMode").title = `Snipping mode: ${m.label} (Alt+M)`;
  $("delayIcon").innerHTML = `<use href="#${S.settings.delay ? "i-timer" : "i-timer-off"}"/>`;
  $("delayText").textContent = S.settings.delay ? S.settings.delay + "s" : "";
  $("btnDelay").title = S.settings.delay ? `Delay: ${S.settings.delay} seconds (Alt+D)` : "No delay (Alt+D)";
  updateEmpty();
}
const WINKEY = `<svg class="winkey" viewBox="0 0 12 12" aria-label="Windows key"><path fill="currentColor" d="M0 0h5.6v5.6H0zM6.4 0H12v5.6H6.4zM0 6.4h5.6V12H0zM6.4 6.4H12V12H6.4z"/></svg>`;
function updateEmpty() {
  const sc = S.shortcuts || { snip: true, record: true };
  const rec = S.settings && S.settings.kind === "record";
  const ok = rec ? sc.record : sc.snip;
  $("emptyLine").innerHTML = ok
    ? `Press <b>${WINKEY} + Alt + ${rec ? "V" : "S"}</b> to start a ${rec ? "recording" : "snip"}`
    : `Select <b>New</b> to start a ${rec ? "recording" : "snip"}`;
  $("emptyHint").textContent = ok ? "" : `${rec ? "Win + Alt + V" : "Win + Alt + S"} is used by another app.`;
}

/* ===================================================================== settings page */
async function saveSettings() { try { const s = await call("stSaveSettings", JSON.stringify(S.settings)); if (s) S.settings = s; } catch (e) { toast("Settings could not be saved: " + esc(e)); } applyTheme(); }
function applyTheme() {
  const t = S.settings ? S.settings.theme : "system";
  const dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);
function toggleCard(key, title, desc, sub) {
  return `<div class="card ${sub ? "sub" : ""}"><div class="txt"><div class="t">${title}</div>${desc ? `<div class="d">${desc}</div>` : ""}</div>
    <label class="toggle"><span>${S.settings[key] ? "On" : "Off"}</span><input type="checkbox" data-key="${key}" ${S.settings[key] ? "checked" : ""}></label></div>`;
}
function showSettings() {
  const s = S.settings, folder = s.saveFolder || S.defaultDir || "Pictures\\Screenshots";
  $("settings").innerHTML = `<div class="set-wrap">
    <div class="set-head"><button id="setBack" title="Back (Esc)">${icon("i-back")}</button><h1>Settings</h1></div>
    <div class="set-sec">Shortcuts</div>
    ${shortcutCard("Start a snip", "S", (S.shortcuts || {}).snip !== false)}
    ${shortcutCard("Start a recording", "V", (S.shortcuts || {}).record !== false)}
    <div class="card"><div class="txt"><div class="t">Print Screen key</div><div class="d">${(S.shortcuts || {}).printScreenWindows
      ? `Windows uses Print Screen for its own screen capture. To use it here, turn off "Use the Print screen key to open screen capture" in Windows Settings.`
      : `Print Screen starts a snip.`}</div></div><button class="btn" id="setPs">Windows Settings</button></div>
    <div class="set-sec">Snipping</div>
    ${toggleCard("autoCopyChanges", "Automatically copy changes", "Changes made to snips are automatically copied to the clipboard")}
    ${toggleCard("autoSaveScreenshots", "Automatically save original screenshots", "Original screenshots are saved to the screenshots folder")}
    <div class="card sub"><div class="txt"><div class="t">Screenshots folder</div><div class="d">${esc(folder)}</div></div><button class="btn" id="setFolder">Change</button></div>
    ${toggleCard("askToSaveEdited", "Ask to save edited screenshots", "Ask before closing a snip with unsaved changes")}
    ${toggleCard("multipleWindows", "Multiple windows", "Open each new snip in its own window")}
    ${toggleCard("openEditorAfterSnip", "Open the editor after every capture", "Open this window directly instead of showing a notification")}
    ${toggleCard("borderEnabled", "Add border to each screenshot", "")}
    <div class="card sub" id="borderOpts" style="${s.borderEnabled ? "" : "display:none"}"><div class="txt"><div class="t">Border</div><div class="d">Color and thickness</div></div>
      <input type="color" id="setBorderColor" value="${s.borderColor}" style="width:36px;height:30px;border:none;background:none">
      <select id="setBorderW">${[1,2,3,4,5,6,8,10].map(n => `<option ${n === s.borderThickness ? "selected" : ""} value="${n}">${n} px</option>`).join("")}</select></div>
    <div class="set-sec">Visual Search</div>
    <div class="card"><div class="txt"><div class="t">Search engine</div><div class="d">Visual Search sends the snip to this search engine in your browser</div></div>
      <select id="setSearch">${[["bing","Bing"],["google","Google Lens"]].map(([v, l]) => `<option value="${v}" ${(s.visualSearch || "bing") === v ? "selected" : ""}>${l}</option>`).join("")}</select></div>
    <div class="set-sec">Text Extractor</div>
    ${toggleCard("textAutoCopy", "Automatically copy text", "Text found by Text Extractor is copied to the clipboard")}
    ${toggleCard("textRemoveLineBreaks", "Remove line breaks", "Join the lines of extracted text into one paragraph")}
    <div class="set-sec">Screen recording</div>
    ${toggleCard("autoSaveRecordings", "Automatically save original screen recordings", "Original screen recordings are saved to the recordings folder")}
    <div class="card sub"><div class="txt"><div class="t">Screen recordings folder</div><div class="d">${esc(s.recordingsFolder || S.defaultVideoDir || "Videos\\Screen Recordings")}</div></div><button class="btn" id="setRecFolder">Change</button></div>
    ${toggleCard("recordMic", "Include microphone input by default when a screen recording starts", "")}
    ${toggleCard("recordSystemAudio", "Include system audio by default when a screen recording starts", "")}
    <div class="set-sec">Appearance</div>
    <div class="card"><div class="txt"><div class="t">App theme</div><div class="d">Select which app theme to display</div></div>
      <div class="radio">${[["light","Light"],["dark","Dark"],["system","Use system setting"]].map(([v, l]) => `<label><input type="radio" name="theme" value="${v}" ${s.theme === v ? "checked" : ""}>${l}</label>`).join("")}</div></div>
    <div class="set-sec">About</div>
    <div class="card"><div class="txt"><div class="t">Snipping Tool Enhanced</div><div class="d">Version ${esc(S.version || "")} · Apache License 2.0</div></div></div>
  </div>`;
  $("settings").classList.add("show");
  $("setBack").onclick = hideSettings;
  $("setPs").onclick = () => call("stOpenWindowsSettings");
  $("setRecFolder").onclick = async () => { const p = await callAsync("stPickFolder"); if (p) { S.settings.recordingsFolder = p; await saveSettings(); showSettings(); } };
  $("setFolder").onclick = async () => { const p = await callAsync("stPickFolder"); if (p) { S.settings.saveFolder = p; await saveSettings(); showSettings(); } };
  $("settings").querySelectorAll("input[data-key]").forEach(i => i.onchange = () => { S.settings[i.dataset.key] = i.checked; i.previousElementSibling.textContent = i.checked ? "On" : "Off"; if (i.dataset.key === "borderEnabled") $("borderOpts").style.display = i.checked ? "" : "none"; saveSettings(); });
  $("setBorderColor").onchange = (e) => { S.settings.borderColor = e.target.value; saveSettings(); };
  $("setBorderW").onchange = (e) => { S.settings.borderThickness = +e.target.value; saveSettings(); };
  $("setSearch").onchange = (e) => { S.settings.visualSearch = e.target.value; saveSettings(); };
  $("settings").querySelectorAll("input[name=theme]").forEach(r => r.onchange = () => { S.settings.theme = r.value; saveSettings(); });
}
function shortcutCard(title, key, ok) {
  return `<div class="card"><div class="txt"><div class="t">${title}</div><div class="d">${ok ? "Works in any app, also when this window is closed" : "Used by another app, so it is not available"}</div></div>
    <div style="font-weight:600;white-space:nowrap">${WINKEY} + Alt + ${key}</div></div>`;
}
function hideSettings() { $("settings").classList.remove("show"); }

/* ===================================================================== start */
async function start() {
  let data = null;
  try { data = await call("stLoad"); } catch (e) { /* preview outside the app */ }
  data = data || { textDefaults: true, shortcuts: { snip: true, record: true, printScreen: true }, settings: { kind: "snip", textAutoCopy: true, textRemoveLineBreaks: false, autoSaveRecordings: false, recordMic: false, recordSystemAudio: true, recordingsFolder: "", autoCopyChanges: true, autoSaveScreenshots: true, askToSaveEdited: true, multipleWindows: false, borderEnabled: false, borderColor: "#000000", borderThickness: 1, openEditorAfterSnip: false, theme: "system", mode: "rectangle", delay: 0, saveFolder: "", visualSearch: "bing" }, printScreen: "ours", version: "preview" };
  S.settings = data.settings; S.version = data.version; S.defaultDir = data.defaultDir; S.defaultVideoDir = data.defaultVideoDir;
  S.shortcuts = data.shortcuts;
  applyTheme(); updateMode(); updateToolIcons();
  if (data.image) showImage(data.image);
  else if (data.video) showVideo(data.video);
}
start();
</script>
